# remap prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# open new windows and split panes in the current directory
bind c new-window -c "#{pane_current_path}"

# split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# navigate windows forward w space and back with backspace
bind-key space next-window
bind-key bspace previous-window

# reload config file using r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded config!"

# Session tree: only allow instant one-key jump for the first 10 sessions,
# numbered 1-9 then 0 (like OS window-switcher shortcuts) rather than 0-9.
# Past row 10, #{line} renders as a multi-digit string which isn't a valid
# single key, so tmux can't bind it -- those rows need j/k/arrows + Enter
# instead. Prevents the "cmd+a+s" (prefix+s) picker from landing on a fixed
# session via an accidental letter keystroke once there are >10 sessions.
bind-key -T prefix s choose-tree -Zs -K '#{?#{<:#{line},9},#{e|+:#{line},1},#{?#{==:#{line},9},0,}}'

# prompt for a name and create a new session
bind-key C new-session

# let programs in a pane (e.g. nvim's unnamedplus yank) reach the real
# system clipboard via OSC 52, instead of it getting trapped in tmux's own
# internal clipboard buffer
set -s set-clipboard on

# mouse
set -g mouse on

# window numbering - set the lowest val to 1 (for keyboard ergonomics) and
# renumber windows as they leave/close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Claude Code's binary is installed under a version-numbered filename, so the
# default rename format (pane_current_command) shows "2.1.274" instead of
# anything readable. Those panes set a useful pane title, so use it for them and
# leave every other window on the command name.
set -g automatic-rename-format '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},#{=20:pane_title},#{pane_current_command}}'

# don't terminate if one session is terminated but there are others
set -g detach-on-destroy off

# clear the attention-needed marker (see claude/hooks/tmux-flag-attention.sh)
# on any window you actually switch into
set-hook -g after-select-window 'run-shell "~/.config/tmux/tmux-clear-flag.sh \"#{session_name}:#{window_index}\""'
set-hook -g client-session-changed 'run-shell "~/.config/tmux/tmux-clear-flag.sh \"#{session_name}:#{window_index}\""'

# show which sessions have a flagged (needs-attention) window in the status bar
set -g status-interval 5
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=21:pane_title}\" #(~/.config/tmux/tmux-attention-summary.sh)"

# local overrides
if-shell "test -f ~/.config/tmux/local_overrides.conf" "source-file ~/.config/tmux/local_overrides.conf"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'                   # tpm itself
set -g @plugin 'tmux-plugins/tmux-sensible'         # basic tmux settings
set -g @plugin 'christoomey/vim-tmux-navigator'     # vim x tmux integration
set -g @plugin 'tmux-plugins/tmux-resurrect'        # save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'        # automated resurrect saves + restore

# survive a reboot: continuum snapshots every 15m and restores when a fresh
# tmux server starts. The tilde is a loose match, so it still fires on a pane
# already running `claude --continue` from a previous restore
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh "~claude->claude --continue"'
set -g @continuum-restore 'on'

# clone tpm itself on a fresh machine -- blocking, so it exists below
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

# init tmux plugin manager (must come after every @plugin line above)
run '~/.config/tmux/plugins/tpm/tpm'

# install any @plugin that isn't cloned yet, so adding one above just needs a
# reload instead of prefix+I. Already-installed plugins are skipped; stdout is
# dropped because tmux pops open a view window for any run-shell output
run -b '~/.config/tmux/plugins/tpm/bin/install_plugins >/dev/null'
